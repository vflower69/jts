name: Add Cloudflare Analytics Snippet to every html file just before the end body tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  inject-snippet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add Cloudflare Analytics snippet to all HTML files
        run: |
          SNIPPET="<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{\"token\": \"8c0d32d91bd347e4990d1409f8061d2f\"}'></script><!-- End Cloudflare Web Analytics -->"

          for file in $(find . -type f -name "*.html"); do
            if ! grep -q "static.cloudflareinsights.com/beacon.min.js" "$file"; then
              # Insert before </body>
              sed -i "s|</body>|  $SNIPPET\n</body>|" "$file"
              echo "Injected snippet into $file"
            else
              echo "Snippet already present in $file"
            fi
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Auto-insert Cloudflare Analytics snippet before </body>" || echo "No changes to commit"
          git push
