name: Inject Back to Games Button

on:
  workflow_dispatch:  # manual trigger only

jobs:
  inject-snippet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject snippet into HTML files
        run: |
          read -r -d '' SNIPPET << 'EOF'<button id="backToGames"><span class="raccoon-face">🦝</span>Back to Games</button>EOF

          for file in $(find ./games -type f -name "*.html"); do
            if ! grep -q "<button id=\"backToGames\"" "$file"; then
              sed -i "s|</body>|  $SNIPPET\n</body>|" "$file"
              echo "Injected snippet into $file"
            else
              echo "Snippet already present in $file"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/*.html
          git commit -m "Inject Back to Games button snippet" || echo "No changes to commit"
          git push
