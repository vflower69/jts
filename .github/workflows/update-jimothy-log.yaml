name: Update Jimothy Log

permissions:
  contents: write

on:
  repository_dispatch:
    types: [jimothy_sighting]

  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload (existing data)"
        required: true
        type: string
      new_entry:
        description: "New sighting entry (single object)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main BEFORE changes
        run: git pull --rebase origin main

      # ---------------------------------------------------------
      # PAYLOAD SELECTION (FIXED — no invalid && / || operators)
      # ---------------------------------------------------------

      - name: Set payload from repository_dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "PAYLOAD=$(echo '${{ toJson(github.event.client_payload) }}')" >> $GITHUB_ENV
          echo "NEW_ENTRY=$(echo '${{ toJson(github.event.client_payload) }}')" >> $GITHUB_ENV

      - name: Set payload from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "PAYLOAD=${{ inputs.payload }}" >> $GITHUB_ENV
          echo "NEW_ENTRY=${{ inputs.new_entry }}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # PROCESSING
      # ---------------------------------------------------------

      - name: Append new sighting to JSON
        env:
          PAYLOAD: ${{ env.PAYLOAD }}
          NEW_ENTRY: ${{ env.NEW_ENTRY }}
        run: |
          # Ensure file exists
          if [ ! -f data/jimothy.json ]; then
            echo '{"locations":[]}' > data/jimothy.json
          fi

          # Validate existing JSON
          jq '.' data/jimothy.json > /dev/null

          # Write new entry safely
          echo "$NEW_ENTRY" > data/new_entry.json
          jq '.' data/new_entry.json > /dev/null

          # Merge new entry into locations array
          jq --argjson entry "$NEW_ENTRY" '.locations += [$entry]' data/jimothy.json > data/tmp.json
          mv data/tmp.json data/jimothy.json

          # Configure Git identity
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"

          # Commit and push
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting" || echo "No changes to commit"
          git push origin main
