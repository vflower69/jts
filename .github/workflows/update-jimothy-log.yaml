name: Update Jimothy Log

permissions:
  contents: write

on:
  repository_dispatch:
    types: [jimothy_sighting]

  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload (existing data)"
        required: true
        type: string
      new_entry:
        description: "New sighting entry (single object)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main BEFORE changes
        run: git pull --rebase origin main

      # ---------------------------------------------------------
      # PAYLOAD EXTRACTION (SAFE — JSON WRITTEN TO FILES)
      # ---------------------------------------------------------

      - name: Extract payload for repository_dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          echo '${{ toJson(github.event.client_payload) }}' > new_entry.json

      - name: Extract payload for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo '${{ inputs.new_entry }}' > new_entry.json

      # ---------------------------------------------------------
      # PROCESSING — MERGE NEW ENTRY INTO jimothy.json
      # ---------------------------------------------------------

      - name: Append new sighting to JSON
        run: |
          # Ensure file exists
          if [ ! -f data/jimothy.json ]; then
            echo '{"locations":[]}' > data/jimothy.json
          fi

          # Validate existing JSON
          jq '.' data/jimothy.json > /dev/null

          # Validate new entry JSON
          jq '.' new_entry.json > /dev/null

          # Merge new entry into locations array
          jq --slurpfile entry new_entry.json '.locations += $entry' data/jimothy.json > data/tmp.json
          mv data/tmp.json data/jimothy.json

          # Configure Git identity
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"

          # Commit and push
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting" || echo "No changes to commit"
          git push origin main
