name: Update Jimothy Log

permissions:
  contents: write

on:
  repository_dispatch:
    types: [jimothy_sighting]
  workflow_dispatch:
    inputs:
      payload:
        description: "Full JSON payload (existing data)"
        required: true
        type: string
      new_entry:
        description: "New sighting entry (single object)"
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with remote main BEFORE changes
        shell: bash
        run: |
          git pull --rebase origin main

      - name: Append new sighting to JSON
        shell: bash
        env:
          # PAYLOAD: ${{ inputs.payload }}
          # NEW_ENTRY: ${{ inputs.new_entry }}
          # Detect trigger type and choose correct payload source
          PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.payload }}
          NEW_ENTRY: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || inputs.new_entry }}
        run: |
          # Ensure file exists
          if [ ! -f data/jimothy.json ]; then
            echo '{"locations":[]}' > data/jimothy.json
          fi

          # Validate existing JSON
          jq '.' data/jimothy.json > /dev/null
          
          # Write new entry safely
          echo "$NEW_ENTRY" > data/new_entry.json
          # Validate JSON
          jq '.' data/new_entry.json > /dev/null

          # Merge new entry into locations array
          # jq --slurpfile entry data/new_entry.json '.locations += $entry' data/tmp.json > data/jimothy.json
          jq --argjson entry "$NEW_ENTRY" '.locations += [$entry]' data/jimothy.json > data/tmp.json
          mv data/tmp.json data/jimothy.json

          # Configure Git identity
          git config user.name "Jimothy Tracker Bot"
          git config user.email "actions@github.com"

          # Commit and push
          git add data/jimothy.json
          git commit -m "Add new Jimothy sighting" || echo "No changes to commit"
          git push -u origin main
