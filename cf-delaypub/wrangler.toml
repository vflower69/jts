name = "jt-github-delayed"
main = "src/worker-main.js"
compatibility_date = "2026-08-30"

[vars]
GH_OWNER = "vflower69"
GH_REPO = "jts"

[[queues.producers]]
queue = "sightingpub-delayed"
binding = "DELAYED_PUBLISH_SIGHTING"

[[queues.consumers]]
queue = "sightingpub-delayed"
script = "jt-github-delayed"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
