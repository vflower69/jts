<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jimothy's Fly Catcher</title>
 <!-- Fly Catcher style sheet -->
  <link rel="stylesheet" href="/assets/flycatcher.css">
</head>
<body>

<div id="header">
  <h1>🦝 Jimothy's Fly Snatcher 🪰</h1>
  <div class="stats">Flies Remaining: <span id="flies-left">10</span> | Score: <span id="score">0</span></div>
</div>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">Catch the Flies!</h2>
    <p id="overlay-desc">Help Jimothy the raccoon catch all the annoying flies! <br><br>Warning: As flies are caught, the remaining ones panic, moving much faster and unpredictably!</p>
    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<!-- Fly Catcher javascript -->
  <script src="/assets/flycatcher.js"></script>

</body>
</html>
