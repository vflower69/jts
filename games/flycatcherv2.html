<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jimothy Fly Catcher</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body {
    background-color: #0b131e;
    color: #e0f7fa;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #header {
    margin-bottom: 10px;
    text-align: center;
  }
  h1 {
    color: #00ffcc;
    text-shadow: 0 0 10px #00ffcc;
    font-size: 2rem;
    margin-bottom: 5px;
  }
  .stats {
    font-size: 1.2rem;
    color: #39ff14;
    text-shadow: 0 0 5px #39ff14;
  }
  #game-container {
    position: relative;
    width: 800px;
    height: 500px;
    background: linear-gradient(180deg, #101c2e 0%, #080d14 100%);
    border: 3px solid #00ffcc;
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    border-radius: 12px;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay h2 {
    font-size: 2.5rem;
    color: #ff007f;
    text-shadow: 0 0 10px #ff007f;
    margin-bottom: 15px;
  }
  #overlay p {
    font-size: 1.1rem;
    margin-bottom: 25px;
    color: #ffffff;
    max-width: 80%;
    text-align: center;
    line-height: 1.5;
  }
  .btn {
    background: #00ffcc;
    color: #000;
    border: none;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    font-family: inherit;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 0 15px #00ffcc;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: #ff007f;
    color: #fff;
    box-shadow: 0 0 15px #ff007f;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div id="header">
  <h1>🦝 Jimothy's Fly Snatcher 🪰</h1>
  <div class="stats">Flies Remaining: <span id="flies-left">12</span> | Score: <span id="score">0</span></div>
</div>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">Catch the Flies!</h2>
    <p id="overlay-desc">Help Jimothy the raccoon catch all the annoying flies! <br><br><b>Controls:</b> Move mouse to aim, Click to swat, Press <b>SPACE</b> to jump!</p>
    <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const fliesLeftEl = document.getElementById('flies-left');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayDesc = document.getElementById('overlay-desc');
const startBtn = document.getElementById('start-btn');

const TOTAL_FLIES = 12;
let flies = [];
let score = 0;
let gameActive = false;
let audioCtx = null;

// Jimothy character properties with jumping physics
const jimothy = {
  x: canvas.width / 2,
  baseY: canvas.height - 10,
  jumpY: 0,
  vy: 0,
  isJumping: false,
  targetX: canvas.width / 2,
  armAngle: 0,
  isSwapping: false,
  swapProgress: 0,
  swapX: 0,
  swapY: 0
};

// Web Audio Synthesizer for Funny Sound Effects
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playJumpSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, now);
  osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
  
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

function playCatchSound() {
  if (!audioCtx) return;
  
  const now = audioCtx.currentTime;
  const sounds = ['boing', 'quack', 'slap', 'pop', 'whistle'];
  const choice = sounds[Math.floor(Math.random() * sounds.length)];

  if (choice === 'boing') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
    
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (choice === 'quack') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(150, now + 0.15);
    
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (choice === 'slap') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
    
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (choice === 'pop') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
    
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } else {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
    
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  }
}

class Fly {
  constructor() {
    this.x = Math.random() * (canvas.width - 100) + 50;
    this.y = Math.random() * (canvas.height - 250) + 50;
    this.radius = 8;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.wingAngle = 0;
  }

  update(baseSpeedMultiplier, randomness) {
    this.x += this.vx;
    this.y += this.vy;

    if (Math.random() < randomness) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + Math.random() * 3) * baseSpeedMultiplier;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
    }

    if (this.x < 20) { this.x = 20; this.vx *= -1; }
    if (this.x > canvas.width - 20) { this.x = canvas.width - 20; this.vx *= -1; }
    if (this.y < 20) { this.y = 20; this.vy *= -1; }
    if (this.y > canvas.height - 180) { this.y = canvas.height - 180; this.vy *= -1; }

    this.wingAngle += 0.5;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.ellipse(-5, -6 + Math.sin(this.wingAngle) * 2, 4, 8, -Math.PI / 4, 0, Math.PI * 2);
    ctx.ellipse(5, -6 + Math.sin(this.wingAngle) * 2, 4, 8, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(-3, -3, 2.5, 0, Math.PI * 2);
    ctx.arc(3, -3, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function initGame() {
  flies = [];
  for (let i = 0; i < TOTAL_FLIES; i++) {
    flies.push(new Fly());
  }
  score = 0;
  jimothy.jumpY = 0;
  jimothy.vy = 0;
  jimothy.isJumping = false;
  updateUI();
}

function updateUI() {
  fliesLeftEl.textContent = flies.length;
  scoreEl.textContent = score;
}

function startGame() {
  initAudio();
  initGame();
  gameActive = true;
  overlay.style.display = 'none';
}

function endGame() {
  gameActive = false;
  overlayTitle.textContent = "All Flies Caught!";
  overlayDesc.textContent = `Jimothy successfully snatched all the flies with supreme agility! Total Score: ${score}`;
  startBtn.textContent = "PLAY AGAIN";
  overlay.style.display = 'flex';
}

// Draw Jimothy
function drawJimothy() {
  // Movement towards target
  jimothy.x += (jimothy.targetX - jimothy.x) * 0.1;

  // Handle Jumping Physics
  if (jimothy.isJumping) {
    jimothy.jumpY += jimothy.vy;
    jimothy.vy += 0.8; // Gravity

    if (jimothy.jumpY >= 0) {
      jimothy.jumpY = 0;
      jimothy.vy = 0;
      jimothy.isJumping = false;
    }
  }

  const currentY = jimothy.baseY + jimothy.jumpY;

  ctx.save();
  ctx.translate(jimothy.x, currentY);

  // 1. Long Legs
  ctx.strokeStyle = '#4A4A4A';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(-25, -40);
  ctx.lineTo(-40, -15);
  ctx.lineTo(-35, 0);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(25, -40);
  ctx.lineTo(40, -15);
  ctx.lineTo(35, 0);
  ctx.stroke();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-35, 0, 6, 0, Math.PI * 2);
  ctx.arc(35, 0, 6, 0, Math.PI * 2);
  ctx.fill();

  // 2. Very Short Striped Tail
  ctx.save();
  ctx.translate(-45, -70);
  ctx.rotate(-0.2);
  ctx.fillStyle = '#8B8B8B';
  ctx.beginPath();
  ctx.ellipse(0, 0, 10, 16, Math.PI / 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-5, -5); ctx.lineTo(5, 5);
  ctx.moveTo(-8, 2); ctx.lineTo(2, 10);
  ctx.stroke();
  ctx.restore();

  // 3. Round Body with Arched Spine
  ctx.fillStyle = '#9E9E9E';
  ctx.beginPath();
  ctx.ellipse(0, -65, 45, 38, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#616161';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, -60, 43, Math.PI * 1.1, Math.PI * 1.9);
  ctx.stroke();

  ctx.fillStyle = '#E0E0E0';
  ctx.beginPath();
  ctx.ellipse(5, -55, 28, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  // 4. Head & Face
  ctx.save();
  ctx.translate(0, -100);

  ctx.fillStyle = '#616161';
  ctx.beginPath();
  ctx.moveTo(-20, -15); ctx.lineTo(-30, -35); ctx.lineTo(-10, -25); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, -15); ctx.lineTo(30, -35); ctx.lineTo(10, -25); ctx.fill();

  ctx.fillStyle = '#9E9E9E';
  ctx.beginPath();
  ctx.ellipse(0, 0, 25, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#212121';
  ctx.beginPath();
  ctx.ellipse(-10, 0, 10, 7, 0.2, 0, Math.PI * 2);
  ctx.ellipse(10, 0, 10, 7, -0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(-10, -1, 4, 0, Math.PI * 2);
  ctx.arc(10, -1, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-10, -1, 2, 0, Math.PI * 2);
  ctx.arc(10, -1, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.ellipse(0, 8, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(0, 5, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // 5. Reaching Arms / Swatting Mechanism
  ctx.strokeStyle = '#4A4A4A';
  ctx.lineWidth = 5;

  if (jimothy.isSwapping) {
    const dx = jimothy.swapX - (jimothy.x);
    const dy = jimothy.swapY - (currentY - 70);
    
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.lineTo(dx * jimothy.swapProgress, dy * jimothy.swapProgress);
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(dx * jimothy.swapProgress, dy * jimothy.swapProgress, 9, 0, Math.PI * 2);
    ctx.fill();

    jimothy.swapProgress += 0.2;
    if (jimothy.swapProgress >= 1) {
      jimothy.isSwapping = false;
    }
  } else {
    ctx.beginPath();
    ctx.moveTo(-20, -65);
    ctx.lineTo(-45, -45);
    ctx.moveTo(20, -65);
    ctx.lineTo(45, -45);
    ctx.stroke();
  }

  ctx.restore();
}

// Mouse movement tracking
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  jimothy.targetX = e.clientX - rect.left;
});

// Spacebar Jump
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameActive && !jimothy.isJumping) {
      jimothy.isJumping = true;
      jimothy.vy = -15; // Initial upward velocity
      playJumpSound();
    }
  }
});

// Click to Catch Fly
canvas.addEventListener('mousedown', (e) => {
  if (!gameActive) return;

  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  jimothy.isSwapping = true;
  jimothy.swapProgress = 0.2;
  jimothy.swapX = clickX;
  jimothy.swapY = clickY;

  for (let i = flies.length - 1; i >= 0; i--) {
    const f = flies[i];
    const dist = Math.hypot(f.x - clickX, f.y - clickY);

    if (dist < f.radius + 22) {
      flies.splice(i, 1);
      score += 100;
      playCatchSound();
      updateUI();

      if (flies.length === 0) {
        endGame();
      }
      break;
    }
  }
});

// Game Loop
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameActive) {
    const fliesCaught = TOTAL_FLIES - flies.length;
    const baseSpeedMultiplier = 1 + (fliesCaught * 0.35);
    const randomness = 0.03 + (fliesCaught * 0.02);

    flies.forEach(fly => {
      fly.update(baseSpeedMultiplier, randomness);
      fly.draw();
    });
  }

  drawJimothy();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
