<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimothy's Fox Den Sweeper</title>
  <!-- Sweep style sheet -->
  <link rel="stylesheet" href="/assets/foxsweep.css">
</head>
<body>

  <!-- Jimothy Raccoon Cursor SVG (Short tail, arched back, narrow triangular face, long legs, round body) -->
  <div id="jimothy-cursor">
    <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Short Ringed Tail -->
      <path d="M 15 50 Q 5 48 8 38 Q 12 30 22 42 Z" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
      <path d="M 12 44 Q 9 40 14 36" stroke="#2c3e50" stroke-width="3"/>
      <path d="M 17 48 Q 13 45 18 40" stroke="#2c3e50" stroke-width="3"/>

      <!-- Long Thin Back Legs -->
      <path d="M 32 62 L 28 82 L 22 84" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Long Thin Front Legs -->
      <path d="M 58 62 L 58 84 L 52 86" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Round Body with Arched Back -->
      <path d="M 22 52 C 20 32 45 28 62 42 C 68 48 65 65 52 68 C 35 70 22 65 22 52 Z" fill="#95a5a6" stroke="#2c3e50" stroke-width="3"/>

      <!-- Narrow Triangular Face / Snout -->
      <polygon points="58,36 88,46 62,58" fill="#bdc3c7" stroke="#2c3e50" stroke-width="2"/>

      <!-- Raccoon Mask -->
      <path d="M 60 40 L 78 44 L 64 52 Z" fill="#2c3e50"/>

      <!-- Small Nose Tip -->
      <polygon points="85,45 89,46 86,48" fill="#000000"/>

      <!-- Eye -->
      <circle cx="68" cy="43" r="2.5" fill="#ffffff"/>
      <circle cx="69" cy="43" r="1" fill="#000000"/>

      <!-- Ears -->
      <polygon points="56,34 60,22 66,35" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
    </svg>
  </div>

  <div class="game-container">
    <h1>🦝 Jimothy's Fox Den Sweeper</h1>

    <div class="legend">
      <div class="legend-item">🫐 Safe</div>
      <div class="legend-item">🍎 1 Den</div>
      <div class="legend-item">🧃 2 Dens</div>
      <div class="legend-item">🍌 3 Dens</div>
      <div class="legend-item">⚠️ 4+ Dens</div>
    </div>

    <div class="stats-bar">
      <span>🦊 Dens Left: <span id="den-count">10</span></span>
      <span>⏱️ Time: <span id="timer">0</span>s</span>
    </div>

    <div id="grid" class="grid"></div>

    <button class="btn" onclick="initGame()">New Search</button>
  </div>

  <!-- Game Over / Win Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Game Over!</h2>
      <p id="modal-message">Jimothy dug up a den and got bit by the fox! 🦊💥</p>
      <button class="btn" onclick="closeModal(); initGame();">Try Again</button>
    </div>
  </div>

  <!-- Fox Sweep javascript -->
  <script src="/assets/foxsweep.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8c0d32d91bd347e4990d1409f8061d2f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
