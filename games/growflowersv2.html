<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grandpa's Cozy Garden - Jimothy Edition</title>
  <!-- Grow Flowersv2 style sheet -->
  <link rel="stylesheet" href="/assets/growflowersv2.css">
</head>
<body>

  <div id="app">
    <!-- Top HUD -->
    <div class="hud">
      <div class="hud-stat">
        🌻 Sunshine Points: <span id="pointsDisplay">0</span>
      </div>
      <button class="btn" id="dailyRewardBtn">🎁 Daily Gift</button>
    </div>

    <!-- Garden Plots Grid -->
    <div class="garden-grid" id="gardenGrid"></div>

    <!-- Jimothy Canvas -->
    <canvas id="jimothyCanvas" width="900" height="650"></canvas>

    <!-- Bottom Controls -->
    <div class="controls" id="seedControls"></div>

    <!-- Celebration Modal -->
    <div class="modal" id="modal">
      <div class="modal-card">
        <h2 id="modalTitle">Welcome Back!</h2>
        <p id="modalMessage">Your garden missed you!</p>
        <button class="btn" id="modalCloseBtn">Continue Gardening</button>
      </div>
    </div>
  </div>
  
  <button id="backToGames">
  <span class="raccoon-face">🦝</span>
  Back to Games
</button>

  <!-- Grow Flowersv2 java script -->
  <script src="/assets/growflowersv2.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8c0d32d91bd347e4990d1409f8061d2f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
