<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grandpa's Cozy Garden - Jimothy Edition</title>
  <!-- Grow Flowersv2 style sheet -->
  <link rel="stylesheet" href="/assets/growflowersv2.css">
</head>
<body>

  <div id="app">
    <!-- Top HUD -->
    <div class="hud">
      <div class="hud-stat">
        🌻 Sunshine Points: <span id="pointsDisplay">0</span>
      </div>
      <button class="btn" id="dailyRewardBtn">🎁 Daily Gift</button>
    </div>

    <!-- Garden Plots Grid -->
    <div class="garden-grid" id="gardenGrid"></div>

    <!-- Jimothy Canvas -->
    <canvas id="jimothyCanvas" width="900" height="650"></canvas>

    <!-- Bottom Controls -->
    <div class="controls" id="seedControls"></div>

    <!-- Celebration Modal -->
    <div class="modal" id="modal">
      <div class="modal-card">
        <h2 id="modalTitle">Welcome Back!</h2>
        <p id="modalMessage">Your garden missed you!</p>
        <button class="btn" id="modalCloseBtn">Continue Gardening</button>
      </div>
    </div>
  </div>
  <script>
    if (window.location.hostname !== "jimothytracker.org") {
      document.body.innerHTML = "🦝 Jimothy says: This is stolen from jimothytracker.org!";}
  </script>
  <script>
    // Audio Synthesizer
    class CozyAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }
      playNote(freq, type='sine', duration=0.3) {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      playChime() {
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          setTimeout(() => this.playNote(f, 'sine', 0.4), i * 100);
        });
      }
      playSneeze() {
        this.init();
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        let now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.22);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + 0.24);
      }
      playWater() {
        this.init();
        this.playNote(300, 'triangle', 0.2);
      }
    }
    const audio = new CozyAudio();

    // Game Config & State
    const SEEDS = [
      { id: 'daisy', name: 'Daisy', icon: '🌼', cost: 0, reward: 15, growTime: 3 },
      { id: 'tulip', name: 'Tulip', icon: '🌷', cost: 10, reward: 30, growTime: 5 },
      { id: 'sunflower', name: 'Sunflower', icon: '🌻', cost: 25, reward: 60, growTime: 8 }
    ];

    let state = {
      points: 50,
      selectedSeed: SEEDS[0].id,
      plots: Array(6).fill(null).map(() => ({ state: 'empty', seed: null, progress: 0 }))
    };

    // Canvas Setup
    const canvas = document.getElementById('jimothyCanvas');
    const ctx = canvas.getContext('2d');

    // Jimothy Raccoon Companion State & AI
    const jimothy = {
      x: 800, y: 560,
      homeX: 800, homeY: 560,
      targetX: 800, targetY: 560,
      scaleX: 1, scaleY: 1,
      eyeState: 'happy',
      isWalking: false,
      sniffingPlotIndex: null,

      walkTo(tx, ty, callback) {
        this.targetX = tx;
        this.targetY = ty;
        this.isWalking = true;
        this.onArrive = callback;
      },

      update() {
        let dx = this.targetX - this.x;
        let dy = this.targetY - this.y;
        let dist = Math.hypot(dx, dy);

        if (dist > 5) {
          this.x += (dx / dist) * 4;
          this.y += (dy / dist) * 4;
          this.scaleY = 1 + Math.sin(Date.now() * 0.015) * 0.08;
        } else {
          this.x = this.targetX;
          this.y = this.targetY;
          if (this.isWalking) {
            this.isWalking = false;
            if (this.onArrive) {
              let cb = this.onArrive;
              this.onArrive = null;
              cb();
            }
          }
        }
      },

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.scale(0.65 * this.scaleX, 0.65 * this.scaleY);

        // Body
        c.fillStyle = '#7a8288';
        c.beginPath(); c.ellipse(0, 0, 45, 40, 0, 0, Math.PI * 2); c.fill();

        // Soft Belly
        c.fillStyle = '#f2e9e4';
        c.beginPath(); c.ellipse(0, 5, 30, 25, 0, 0, Math.PI * 2); c.fill();

        // Head
        c.fillStyle = '#9a8c98';
        c.beginPath(); c.ellipse(0, -40, 38, 30, 0, 0, Math.PI * 2); c.fill();

        // Mask
        c.fillStyle = '#22223b';
        c.beginPath();
        c.ellipse(-14, -40, 14, 9, 0.2, 0, Math.PI * 2);
        c.ellipse(14, -40, 14, 9, -0.2, 0, Math.PI * 2);
        c.fill();

        // Eyes
        c.fillStyle = '#ffffff';
        c.beginPath(); c.arc(-13, -41, 5, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(13, -41, 5, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#000000';
        c.beginPath(); c.arc(-12, -41, 2.5, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(14, -41, 2.5, 0, Math.PI * 2); c.fill();

        // Nose
        c.fillStyle = '#000';
        c.beginPath(); c.ellipse(0, -32, 4, 3, 0, 0, Math.PI * 2); c.fill();

        c.restore();
      }
    };

    // DOM Elements & HUD
    const pointsDisplay = document.getElementById('pointsDisplay');
    const gardenGrid = document.getElementById('gardenGrid');
    const seedControls = document.getElementById('seedControls');
    const modal = document.getElementById('modal');

    function updateHUD() {
      pointsDisplay.textContent = state.points;
    }

    function renderControls() {
      seedControls.innerHTML = '';
      SEEDS.forEach(seed => {
        const btn = document.createElement('button');
        btn.className = `seed-btn ${state.selectedSeed === seed.id ? 'active' : ''}`;
        btn.innerHTML = `${seed.icon} ${seed.name} (Cost: ${seed.cost})`;
        btn.onclick = () => {
          state.selectedSeed = seed.id;
          renderControls();
        };
        seedControls.appendChild(btn);
      });
    }

    function renderGarden() {
      gardenGrid.innerHTML = '';
      state.plots.forEach((plot, index) => {
        const div = document.createElement('div');
        div.className = 'plot';
        div.id = `plot-${index}`;
        div.onclick = (e) => handlePlotClick(index, e, div);

        let icon = '🌱';
        let status = 'Tap to Plant';

        if (plot.state === 'growing') {
          icon = '🌱';
          status = 'Growing...';
        } else if (plot.state === 'ready') {
          const seedData = SEEDS.find(s => s.id === plot.seed);
          icon = seedData ? seedData.icon : '🌸';
          status = 'Jimothy Sniff! 🦝✨';
        }

        div.innerHTML = `
          <div class="plant-icon">${plot.state === 'empty' ? '🕳️' : icon}</div>
          <div class="plot-status">${status}</div>
        `;
        gardenGrid.appendChild(div);
      });
    }

    // Interaction Handlers
    function handlePlotClick(index, event, element) {
      audio.init();
      const plot = state.plots[index];

      if (plot.state === 'empty') {
        const seedData = SEEDS.find(s => s.id === state.selectedSeed);
        if (state.points >= seedData.cost) {
          state.points -= seedData.cost;
          plot.state = 'growing';
          plot.seed = seedData.id;
          plot.progress = 0;
          audio.playWater();
          spawnParticle(event.clientX, event.clientY, '💧');
          startGrowing(index, seedData.growTime);
        } else {
          showModal('Need More Sunshine!', 'Harvest blooming flowers or claim your daily gift to get more Sunshine Points.');
        }
      } else if (plot.state === 'ready') {
        // Trigger Jimothy Sniff & Sneeze Sequence!
        const rect = element.getBoundingClientRect();
        const appRect = document.getElementById('app').getBoundingClientRect();
        const targetX = (rect.left + rect.width / 2) - appRect.left;
        const targetY = (rect.top + rect.height / 2) - appRect.top + 30;

        jimothy.walkTo(targetX, targetY, () => {
          // Sniff & Sneeze Logic
          setTimeout(() => {
            audio.playSneeze();
            const seedData = SEEDS.find(s => s.id === plot.seed);
            state.points += seedData.reward;
            plot.state = 'empty';
            plot.seed = null;

            spawnParticle(targetX, targetY - 40, `ACHOO! 🤧🎉`);
            spawnParticle(targetX, targetY - 80, `+${seedData.reward} ☀️`);

            updateHUD();
            renderGarden();

            // Return Jimothy Home
            setTimeout(() => {
              jimothy.walkTo(jimothy.homeX, jimothy.homeY);
            }, 600);
          }, 300);
        });
      }

      updateHUD();
      renderGarden();
    }

    function startGrowing(index, growTime) {
      let interval = setInterval(() => {
        if (state.plots[index].state !== 'growing') {
          clearInterval(interval);
          return;
        }
        state.plots[index].progress += 1;
        if (state.plots[index].progress >= growTime) {
          state.plots[index].state = 'ready';
          clearInterval(interval);
          renderGarden();
        }
      }, 1000);
    }

    function spawnParticle(x, y, text) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = text;
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1300);
    }

    function showModal(title, message) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      modal.classList.add('open');
    }

    document.getElementById('modalCloseBtn').onclick = () => modal.classList.remove('open');

    document.getElementById('dailyRewardBtn').onclick = () => {
      audio.playChime();
      state.points += 50;
      updateHUD();
      showModal('Daily Gift Claimed! 🎁', 'You received 50 Sunshine Points! Come back every day for more gifts.');
    };

    // Main Game Loop
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      jimothy.update();
      jimothy.draw(ctx);
      requestAnimationFrame(loop);
    }

    // Init Game
    updateHUD();
    renderControls();
    renderGarden();
    loop();
  </script>
  <button id="backToGames">
  <span class="raccoon-face">🦝</span>
  Back to Games
</button>

</body>
</html>
