<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jimothy's Night Snack Run</title>
  <!-- Night Run style sheet -->
  <link rel="stylesheet" href="/assets/nightrun.css">
</head>
<body>

  <div class="game-container">
    <div class="header">
      <h1>🦝 Jimothy's Night Snack Run</h1>
      <div class="instructions">Guide Jimothy with your cursor to the Vending Machine! Avoid the cougars' spotlights! 🐾</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <button class="btn" onclick="resetGame()">Restart Level</button>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Spotted!</h2>
      <p id="modal-message">A cougar caught Jimothy! Try to stay out of their sight lines.</p>
      <button class="btn" onclick="closeModal(); resetGame();">Play Again</button>
    </div>
  </div>

  <!-- Night Run javascript -->
  <script src="/assets/nightrun.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8c0d32d91bd347e4990d1409f8061d2f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
