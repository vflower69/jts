<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimothy: Raccoon Scrapper</title>
    <!-- Scrap style sheet -->
  <link rel="stylesheet" href="/assets/scrap.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- --- HUD (Heads Up Display) --- -->
        <div class="hud">
            <div class="hud-left">
                <div id="player-name">JIMOTHY (🦝)</div>
                <div class="health-bar"><div class="health-fill" id="player-health"></div></div>
                <div>Score: <span id="score-text">0</span></div>
            </div>
            <div id="high-score-text">H: <span id="high-score-value">21000</span></div>
            <div class="hud-right">
                <div id="enemy-name">WASTE BIN (🗑️)</div>
                <div class="health-bar"><div class="health-fill" id="enemy-health"></div></div>
            </div>
        </div>

        <!-- --- Combat FX Overlays --- -->
        <div class="combat-overlay">
            <div class="pow-text" id="pow-effect">POW!</div>
            <div class="combo-counter" id="combo-effect">COMBO!</div>
        </div>

        <!-- --- Input Overlays --- -->
        <div class="input-panel">
            <div class="input-btn" id="key-punch"> [J] PUNCH</div>
            <div class="input-btn" id="key-kick"> [K] KICK</div>
            <div class="input-btn" id="key-jump"> [SPACE] JUMP</div>
        </div>

        <!-- --- UI SCREENS --- -->
        <!-- Start Screen -->
        <div id="startScreen" class="ui-screen">
            <h1 class="victory-title">JIMOTHY'S SCRAP</h1>
            <div class="instruction-box">
                <div>Controls:</div>
                <div>[A/D] - Move Left/Right</div>
                <div>[J] - PUNCH</div>
                <div>[K] - KICK</div>
                <div>[SPACE] - JUMP</div>
            </div>
            <button class="btn" id="startBtn">FIGHT!</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="ui-screen hidden">
            <div class="game-over-title">BUSTED!</div>
            <div style="margin-bottom: 20px;">Score: <span id="finalScoreText">0</span></div>
            <button class="btn" id="restartBtn">RETRY?</button>
        </div>

         <!-- Victory Screen -->
         <div id="victoryScreen" class="ui-screen hidden">
            <div class="victory-title">VICTORY!</div>
            <div style="margin-bottom: 20px;">You recycled the Bin! Final Score: <span id="winScoreText">0</span></div>
            <button class="btn" id="winBtn">PLAY AGAIN?</button>
        </div>
    </div>
   <!-- Scrap javascript -->
  <script src="/assets/scrap.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8c0d32d91bd347e4990d1409f8061d2f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
