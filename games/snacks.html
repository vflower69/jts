<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jimothy Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 1.5rem 1rem 0.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    p.subtitle {
      margin: 0.5rem 0 1rem;
      color: #9ca3af;
    }

    #game-container {
      background: #020617;
      border-radius: 0.75rem;
      padding: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 480px;
      width: 100%;
      margin-bottom: 2rem;
    }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    #score, #timer, #level {
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      background: #111827;
    }

    #score span, #timer span, #level span {
      font-weight: 600;
      color: #22c55e;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .cell {
      position: relative;
      padding-top: 100%;
      background: #1f2937;
      border-radius: 0.5rem;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .cell:hover {
      transform: translateY(-2px);
      background: #111827;
    }

    .cell.jimothy {
      background: #22c55e;
    }

    .cell.trash {
      background: #f97316;
    }

    .cell.fake {
      background: #3b82f6;
    }

    .cell-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    #message {
      margin-top: 0.75rem;
      min-height: 1.5rem;
      font-size: 0.95rem;
      color: #e5e7eb;
    }

    #controls {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #22c55e;
      color: #022c22;
      font-weight: 600;
      transition: background 0.1s ease, transform 0.08s ease;
    }

    button.secondary {
      background: #374151;
      color: #e5e7eb;
    }

    button:hover {
      transform: translateY(-1px);
      background: #16a34a;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    footer {
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 480px) {
      #game-container {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jimothy’s Sneaky Snack Dash</h1>
    <p class="subtitle">
      Click Jimothy, avoid trash, and don’t get fooled by fake raccoons. Good luck, human.
    </p>
  </header>

  <main id="game-container">
    <div id="top-bar">
      <div id="score">Score: <span>0</span></div>
      <div id="level">Level: <span>1</span></div>
      <div id="timer">Time: <span>30</span>s</div>
    </div>

    <div id="grid"></div>

    <div id="message"></div>

    <div id="controls">
      <button id="start-btn">Start Game</button>
      <button id="reset-btn" class="secondary">Reset</button>
    </div>
  </main>

  <footer>
    Jimothy is not responsible for any rage-quits, only for stolen snacks.
  </footer>
  <script>
    if (window.location.hostname !== "jimothytracker.org") {
      document.body.innerHTML = "🦝 Jimothy says: This is stolen from jimothytracker.org!";}
  </script>
  <script>
    const gridEl = document.getElementById("grid");
    const scoreEl = document.querySelector("#score span");
    const timerEl = document.querySelector("#timer span");
    const levelEl = document.querySelector("#level span");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("start-btn");
    const resetBtn = document.getElementById("reset-btn");

    const GRID_SIZE = 16;
    let score = 0;
    let timeLeft = 30;
    let level = 1;
    let timerId = null;
    let roundIntervalId = null;
    let gameRunning = false;

    function createGrid() {
      gridEl.innerHTML = "";
      for (let i = 0; i < GRID_SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const content = document.createElement("div");
        content.className = "cell-content";
        cell.appendChild(content);
        gridEl.appendChild(cell);
      }
    }

    function randomIndices(count) {
      const indices = [];
      while (indices.length < count) {
        const idx = Math.floor(Math.random() * GRID_SIZE);
        if (!indices.includes(idx)) indices.push(idx);
      }
      return indices;
    }

    function renderRound() {
      const cells = Array.from(document.querySelectorAll(".cell"));
      cells.forEach((cell) => {
        cell.classList.remove("jimothy", "trash", "fake");
        cell.firstChild.textContent = "";
        cell.onclick = null;
      });

      const jimothyCount = Math.min(3, 1 + Math.floor(level / 2));
      const trashCount = Math.min(4, 2 + level);
      const fakeCount = Math.min(3, 1 + Math.floor(level / 3));

      const jimothyIndices = randomIndices(jimothyCount);
      const trashIndices = randomIndices(trashCount);
      const fakeIndices = randomIndices(fakeCount);

      jimothyIndices.forEach((idx) => {
        const cell = cells[idx];
        cell.classList.add("jimothy");
        cell.firstChild.textContent = "🦝";
        cell.onclick = () => handleClick("jimothy", cell);
      });

      trashIndices.forEach((idx) => {
        if (jimothyIndices.includes(idx)) return;
        const cell = cells[idx];
        cell.classList.add("trash");
        cell.firstChild.textContent = "🗑️";
        cell.onclick = () => handleClick("trash", cell);
      });

      fakeIndices.forEach((idx) => {
        if (jimothyIndices.includes(idx) || trashIndices.includes(idx)) return;
        const cell = cells[idx];
        cell.classList.add("fake");
        cell.firstChild.textContent = "🦝✨";
        cell.onclick = () => handleClick("fake", cell);
      });

      messageEl.textContent =
        "Find real Jimothy (🦝). Trash (🗑️) and sparkly raccoons (🦝✨) are trouble.";
    }

    function handleClick(type, cell) {
      if (!gameRunning) return;

      if (type === "jimothy") {
        score += 5;
        messageEl.textContent = "Nice! Jimothy approves of your reflexes.";
      } else if (type === "trash") {
        score -= 3;
        messageEl.textContent = "Oof. You clicked trash. Jimothy is judging you.";
      } else if (type === "fake") {
        score -= 6;
        messageEl.textContent =
          "That was a decoy raccoon. Jimothy just learned a new trick.";
      }

      scoreEl.textContent = score;
      cell.onclick = null;
      cell.style.transform = "scale(0.95)";
      setTimeout(() => {
        cell.style.transform = "";
      }, 80);

      if (score >= level * 25) {
        level++;
        levelEl.textContent = level;
        messageEl.textContent =
          "Level up! Jimothy is getting faster. Stay sharp.";
      }
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function startRounds() {
      clearInterval(roundIntervalId);
      const interval = Math.max(600, 1500 - level * 100);
      roundIntervalId = setInterval(renderRound, interval);
      renderRound();
    }

    function startGame() {
      if (gameRunning) return;
      gameRunning = true;
      score = 0;
      timeLeft = 30;
      level = 1;
      scoreEl.textContent = score;
      timerEl.textContent = timeLeft;
      levelEl.textContent = level;
      messageEl.textContent = "Game started! Jimothy is on the move.";
      startTimer();
      startRounds();
    }

    function endGame() {
      gameRunning = false;
      clearInterval(timerId);
      clearInterval(roundIntervalId);
      messageEl.textContent =
        score >= 40
          ? `Game over! Final score: ${score}. Jimothy is mildly impressed.`
          : `Game over! Final score: ${score}. Jimothy suggests more practice.`;
    }

    function resetGame() {
      gameRunning = false;
      clearInterval(timerId);
      clearInterval(roundIntervalId);
      score = 0;
      timeLeft = 30;
      level = 1;
      scoreEl.textContent = score;
      timerEl.textContent = timeLeft;
      levelEl.textContent = level;
      messageEl.textContent = "Game reset. Jimothy is stretching.";
      createGrid();
    }

    startBtn.addEventListener("click", startGame);
    resetBtn.addEventListener("click", resetGame);

    // Initial setup
    createGrid();
  </script>

</body>
</html>
