<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Raccoon Jimothy's Snack Shooter</title>
    <!-- Snack Shootv2 style sheet -->
  <link rel="stylesheet" href="/assets/snackshooterv2.css">
</head>
<body>

<div id="game-container">
    <div class="header">
        <div>SCORE: <span id="score">0</span></div>
        <div class="next-preview">
            NEXT: <div id="nextBubble" class="bubble-next"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOverModal" class="overlay hidden">
        <h1>🦝 Game Over!</h1>
        <p>Jimothy ran out of room for snacks!</p>
        <button onclick="resetGame()">Play Again 🦝</button>
    </div>
</div>

<!-- Snack Shoot v2 javascript -->
  <script src="/assets/snackshooterv2.js"></script>
</body>
</html>
