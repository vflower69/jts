<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jimothy's Tickle Party!</title>
  <!-- Tickle style sheet -->
  <link rel="stylesheet" href="/assets/tickle.css">
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="meter-container">
        <span>TICKLE-O-METER 💖</span>
        <div class="bar-bg">
          <div id="meterFill" class="bar-fill"></div>
        </div>
      </div>
      <div class="score-badge">
        GIGGLES: <span id="scoreVal">0</span> ⭐
      </div>
    </div>

    <div id="speech-bubble">Tee-hee! Tickle me! 🦝</div>

    <canvas id="canvas" width="850" height="550"></canvas>
  </div>
  
  <button id="backToGames">
    <span class="raccoon-face">🦝</span>
    Back to Games
  </button>
  <!-- Tickle java script -->
  <script src="/assets/tickle.js"></script>

</body>
</html>
