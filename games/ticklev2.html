<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jimothy's Tickle Party - Face & Eye Edition!</title>
  <style>
    :root {
      --bg-top: #ffd1dc;
      --bg-bottom: #b5ead7;
      --accent: #ff6b6b;
      --gold: #ffe66d;
      --card-bg: rgba(255, 255, 255, 0.85);
      --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 850px;
      height: 550px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 15px rgba(255,255,255,0.6);
      border: 4px solid #fff;
      background: radial-gradient(circle at center, #ffffff 0%, #f0f7ff 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Top HUD */
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .meter-container {
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 30px;
      border: 3px solid #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      color: #4a4a4a;
    }

    .bar-bg {
      width: 160px;
      height: 16px;
      background: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #fff;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a9e, #fecfef);
      transition: width 0.15s ease-out;
    }

    .score-badge {
      background: var(--card-bg);
      padding: 10px 22px;
      border-radius: 30px;
      border: 3px solid #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff6b6b;
    }

    /* Silly Speech Bubble */
    #speech-bubble {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #ffffff;
      border: 3px solid #ff6b6b;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      pointer-events: none;
      z-index: 10;
    }

    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #ff6b6b transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="meter-container">
        <span>TICKLE-O-METER 💖</span>
        <div class="bar-bg">
          <div id="meterFill" class="bar-fill"></div>
        </div>
      </div>
      <div class="score-badge">
        GIGGLES: <span id="scoreVal">0</span> ⭐
      </div>
    </div>

    <div id="speech-bubble">Touch my face & eyes! 🦝✨</div>

    <canvas id="canvas" width="850" height="550"></canvas>
  </div>
  <script>
    if (window.location.hostname !== "jimothytracker.org") {
      document.body.innerHTML = "🦝 Jimothy says: This is stolen from jimothytracker.org!";}
  </script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const meterFill = document.getElementById('meterFill');
    const scoreVal = document.getElementById('scoreVal');
    const speechBubble = document.getElementById('speech-bubble');

    let giggles = 0;
    let tickleMeter = 0;
    let particles = [];

    // Sound Synthesizer
    class TickleAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }
      playGigglySqueak(pitchModifier = 1) {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sine';
        let now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(400 * pitchModifier, now);
        osc.frequency.exponentialRampToValueAtTime(900 * pitchModifier, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(600 * pitchModifier, now + 0.2);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);

        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + 0.22);
      }
      playBoing() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'triangle';
        let now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);

        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + 0.16);
      }
      playSneeze() {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        let now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);

        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + 0.22);
      }
    }
    const audio = new TickleAudio();

    // Jimothy Raccoon Character State
    const jimothy = {
      x: 425, y: 320,
      scaleX: 1, scaleY: 1,
      rotation: 0,
      eyeState: 'happy', // happy, winking, dizzy, crossed, squint
      earTwitch: 0,
      tailWag: 0,
      blush: 0,
      sneezeTimer: 0,

      react(part) {
        audio.init();
        giggles += 5;
        tickleMeter = Math.min(100, tickleMeter + 12);
        scoreVal.textContent = giggles;
        meterFill.style.width = tickleMeter + '%';

        this.blush = 1;

        if (part === 'eyes') {
          this.rotation = (Math.random() - 0.5) * 0.6;
          this.eyeState = 'dizzy';
          audio.playBoing();
          showBubble("Whoa! My eyes are spinning! 🌀👀");
          spawnParticles(this.x, this.y - 70, '⭐', 6);
        } else if (part === 'nose') {
          this.scaleX = 0.8; this.scaleY = 1.3;
          this.eyeState = 'crossed';
          audio.playSneeze();
          showBubble("Achoo! Tickly nose! 🤧🎉");
          spawnParticles(this.x, this.y - 50, '✨', 8);
        } else if (part === 'cheeks') {
          this.scaleX = 1.2; this.scaleY = 0.9;
          this.eyeState = 'winking';
          audio.playGigglySqueak(1.3);
          showBubble("Squishy cheek tickles! 😊💖");
          spawnParticles(this.x, this.y - 50, '💖', 6);
        } else if (part === 'ears') {
          this.earTwitch = 15;
          this.eyeState = 'winking';
          audio.playGigglySqueak(1.4);
          showBubble("Eeeek! Not my ears! 🦝👂");
          spawnParticles(this.x, this.y - 120, '✨', 5);
        } else if (part === 'belly') {
          this.scaleX = 1.25; this.scaleY = 0.8;
          this.eyeState = 'happy';
          audio.playGigglySqueak(1.0);
          showBubble("Belly tickles! TEE-HEE-HEE! 💖");
          spawnParticles(this.x, this.y, '💖', 6);
        } else if (part === 'paws') {
          this.rotation = (Math.random() - 0.5) * 0.4;
          this.eyeState = 'happy';
          audio.playBoing();
          showBubble("Silly toe beans! 🐾✨");
          spawnParticles(this.x, this.y + 80, '🫐', 4);
        } else if (part === 'tail') {
          this.tailWag = 25;
          this.eyeState = 'dizzy';
          audio.playGigglySqueak(0.8);
          showBubble("Whoa! My fluffy tail! 🌀");
          spawnParticles(this.x + 100, this.y + 40, '⭐', 5);
        }
      },

      update() {
        this.scaleX += (1 - this.scaleX) * 0.12;
        this.scaleY += (1 - this.scaleY) * 0.12;
        this.rotation += (0 - this.rotation) * 0.1;
        this.blush *= 0.95;

        if (this.earTwitch > 0) this.earTwitch--;
        if (this.tailWag > 0) this.tailWag--;
      },

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.scale(this.scaleX, this.scaleY);
        c.rotate(this.rotation);

        // Tail
        c.save();
        let tailAngle = Math.sin(Date.now() * 0.01) * 0.2 + (this.tailWag ? Math.sin(Date.now() * 0.05) * 0.8 : 0);
        c.translate(70, 40);
        c.rotate(tailAngle);
        c.fillStyle = '#4a4e69';
        c.beginPath();
        c.ellipse(40, -10, 45, 22, 0.3, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#22223b';
        c.fillRect(30, -28, 12, 38);
        c.fillRect(55, -20, 12, 32);
        c.restore();

        // Feet / Paws
        c.fillStyle = '#22223b';
        c.beginPath();
        c.ellipse(-45, 95, 20, 12, 0, 0, Math.PI * 2);
        c.ellipse(45, 95, 20, 12, 0, 0, Math.PI * 2);
        c.fill();

        // Main Body
        c.fillStyle = '#7a8288';
        c.beginPath();
        c.ellipse(0, 20, 95, 85, 0, 0, Math.PI * 2);
        c.fill();

        // Soft Belly
        c.fillStyle = '#f2e9e4';
        c.beginPath();
        c.ellipse(0, 30, 65, 55, 0, 0, Math.PI * 2);
        c.fill();

        // Head
        c.fillStyle = '#9a8c98';
        c.beginPath();
        c.ellipse(0, -65, 75, 60, 0, 0, Math.PI * 2);
        c.fill();

        // Ears
        let earL = Math.sin(this.earTwitch) * 0.2;
        let earR = -Math.sin(this.earTwitch) * 0.2;

        c.save();
        c.translate(-50, -110); c.rotate(earL);
        c.fillStyle = '#4a4e69';
        c.beginPath(); c.arc(0, 0, 24, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffcad4';
        c.beginPath(); c.arc(0, 0, 13, 0, Math.PI * 2); c.fill();
        c.restore();

        c.save();
        c.translate(50, -110); c.rotate(earR);
        c.fillStyle = '#4a4e69';
        c.beginPath(); c.arc(0, 0, 24, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffcad4';
        c.beginPath(); c.arc(0, 0, 13, 0, Math.PI * 2); c.fill();
        c.restore();

        // Raccoon Mask
        c.fillStyle = '#22223b';
        c.beginPath();
        c.ellipse(-28, -65, 28, 18, 0.2, 0, Math.PI * 2);
        c.ellipse(28, -65, 28, 18, -0.2, 0, Math.PI * 2);
        c.fill();

        // Eyes Render Modes
        if (this.eyeState === 'happy') {
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(-26, -67, 9, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(26, -67, 9, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#000000';
          c.beginPath(); c.arc(-24, -67, 4, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(28, -67, 4, 0, Math.PI * 2); c.fill();
        } else if (this.eyeState === 'winking') {
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(-26, -67, 9, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#000'; c.beginPath(); c.arc(-24, -67, 4, 0, Math.PI * 2); c.fill();
          c.strokeStyle = '#fff'; c.lineWidth = 3;
          c.beginPath(); c.arc(26, -67, 8, 0.1, Math.PI); c.stroke();
        } else if (this.eyeState === 'dizzy') {
          c.strokeStyle = '#ffffff'; c.lineWidth = 3;
          c.beginPath(); c.arc(-26, -67, 8, Date.now() * 0.01, Date.now() * 0.01 + 4); c.stroke();
          c.beginPath(); c.arc(26, -67, 8, -Date.now() * 0.01, -Date.now() * 0.01 + 4); c.stroke();
        } else if (this.eyeState === 'crossed') {
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(-26, -67, 9, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(26, -67, 9, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#000000';
          c.beginPath(); c.arc(-20, -67, 4, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(20, -67, 4, 0, Math.PI * 2); c.fill();
        }

        // Cute Nose
        c.fillStyle = '#000000';
        c.beginPath();
        c.ellipse(0, -52, 7, 5, 0, 0, Math.PI * 2);
        c.fill();

        // Cheerful Blush
        if (this.blush > 0.05) {
          c.fillStyle = `rgba(255, 107, 107, ${this.blush * 0.7})`;
          c.beginPath(); c.arc(-42, -50, 12, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(42, -50, 12, 0, Math.PI * 2); c.fill();
        }

        c.restore();
      }
    };

    // Speech Bubble Helper
    let bubbleTimeout;
    function showBubble(text) {
      speechBubble.textContent = text;
      speechBubble.style.transform = 'translateX(-50%) scale(1)';
      clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => {
        speechBubble.style.transform = 'translateX(-50%) scale(0)';
      }, 1400);
    }

    // Particle Burst Effects
    function spawnParticles(x, y, emoji, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: -Math.random() * 5 - 2,
          emoji,
          size: 20 + Math.random() * 12,
          life: 40
        });
      }
    }

    // Touch & Hit Region Detection
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      let dx = mx - jimothy.x;
      let dy = my - jimothy.y;

      // Eyes Zone
      if (Math.hypot(mx - (jimothy.x - 26), my - (jimothy.y - 67)) < 22 ||
          Math.hypot(mx - (jimothy.x + 26), my - (jimothy.y - 67)) < 22) {
        jimothy.react('eyes');
      }
      // Nose / Muzzle Zone
      else if (Math.hypot(dx, my - (jimothy.y - 52)) < 18) {
        jimothy.react('nose');
      }
      // Cheeks Zone
      else if (Math.hypot(mx - (jimothy.x - 42), my - (jimothy.y - 50)) < 22 ||
               Math.hypot(mx - (jimothy.x + 42), my - (jimothy.y - 50)) < 22) {
        jimothy.react('cheeks');
      }
      // Ears Zone
      else if (Math.hypot(mx - (jimothy.x - 50), my - (jimothy.y - 110)) < 35 ||
               Math.hypot(mx - (jimothy.x + 50), my - (jimothy.y - 110)) < 35) {
        jimothy.react('ears');
      }
      // Belly Zone
      else if (Math.hypot(dx, dy - 20) < 65) {
        jimothy.react('belly');
      }
      // Paws Zone
      else if (Math.hypot(mx - (jimothy.x - 45), my - (jimothy.y + 95)) < 30 ||
               Math.hypot(mx - (jimothy.x + 45), my - (jimothy.y + 95)) < 30) {
        jimothy.react('paws');
      }
      // Tail Zone
      else if (Math.hypot(mx - (jimothy.x + 110), my - (jimothy.y + 30)) < 45) {
        jimothy.react('tail');
      }
    });

    // Main Loop
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (tickleMeter > 0) {
        tickleMeter -= 0.08;
        meterFill.style.width = tickleMeter + '%';
      }

      jimothy.update();
      jimothy.draw(ctx);

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;

        ctx.font = `${p.size}px sans-serif`;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillText(p.emoji, p.x, p.y);
        ctx.globalAlpha = 1.0;

        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
  <button id="backToGames">
    <span class="raccoon-face">🦝</span>
    Back to Games
  </button>

</body>
</html>
