<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jimothy LOL Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0f172a;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #e5e7eb;
      text-align: center;
    }

    #title {
      margin-top: 1rem;
      font-size: 2rem;
    }

    #jimothy {
      position: absolute;
      font-size: 6rem;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .particle {
      position: absolute;
      font-size: 2rem;
      animation: explode 1s linear forwards;
    }

    @keyframes explode {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to {
        transform: translate(
          calc(200px - 400px * var(--rx)),
          calc(200px - 400px * var(--ry))
        ) scale(0.2);
        opacity: 0;
      }
    }

    .clone {
      position: absolute;
      font-size: 3rem;
      animation: wiggle 0.5s infinite;
    }

    @keyframes wiggle {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(20deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }

    .bounce {
      animation: bounce 0.4s infinite;
    }

    .spin {
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="title">Click Jimothy for Maximum LOL</div>
  <div id="jimothy">🦝</div>

  <script>
    const jimothy = document.getElementById("jimothy");

    function teleport() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      jimothy.style.left = x + "px";
      jimothy.style.top = y + "px";
    }

    function particles() {
      for (let i = 0; i < 30; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = "🦝";

        p.style.left = jimothy.offsetLeft + "px";
        p.style.top = jimothy.offsetTop + "px";

        p.style.setProperty("--rx", Math.random());
        p.style.setProperty("--ry", Math.random());

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
      }
    }

    function clones() {
      for (let i = 0; i < 10; i++) {
        const c = document.createElement("div");
        c.className = "clone";
        c.textContent = "🦝";

        c.style.left = Math.random() * window.innerWidth + "px";
        c.style.top = Math.random() * window.innerHeight + "px";

        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1500);
      }
    }

    function bounce() {
      jimothy.classList.add("bounce");
      setTimeout(() => jimothy.classList.remove("bounce"), 1500);
    }

    function spin() {
      jimothy.classList.add("spin");
      setTimeout(() => jimothy.classList.remove("spin"), 1500);
    }

    function scream() {
      const audio = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=");
      audio.play();
    }

    jimothy.addEventListener("click", () => {
      teleport();
      particles();
      clones();
      bounce();
      spin();
      scream();
    });

    // Dramatic entrance
    setTimeout(() => {
      jimothy.style.transform = "scale(3)";
      setTimeout(() => {
        jimothy.style.transform = "scale(1)";
      }, 500);
    }, 800);
  </script>

</body>
</html>
