<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jimothy's Disco Dance Party! 🪩🦝</title>
  <style>
    :root {
      --font: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0c20;
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 850px;
      height: 550px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 0, 222, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.2);
      border: 4px solid #ff007f;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* HUD Controls */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .btn {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: #fff;
      border: 3px solid #fff;
      padding: 14px 28px;
      border-radius: 40px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 0, 127, 0.5);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      font-family: var(--font);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 0, 127, 0.8);
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Speech Bubble for Lyrics */
    #lyrics-bubble {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: #ffffff;
      color: #000;
      border: 4px solid #ff007f;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1.4rem;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      pointer-events: none;
      z-index: 10;
    }

    #lyrics-bubble::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 14px 12px 0;
      border-style: solid;
      border-color: #ff007f transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="lyrics-bubble">Tap "Start Disco!" 🪩🎶</div>
    <canvas id="canvas" width="850" height="550"></canvas>
    <div class="controls">
      <button class="btn" id="startBtn">🪩 START DISCO SONG!</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const lyricsBubble = document.getElementById('lyrics-bubble');
    const startBtn = document.getElementById('startBtn');

    // --- Audio Synthesizer for Disco Beat & Singing ---
    class DiscoAudio {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.step = 0;
        this.timer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }

      playKick() {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + 0.15);
      }

      playHiHat() {
        let now = this.ctx.currentTime;
        let bufferSize = this.ctx.sampleRate * 0.05;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

        noise.connect(gain); gain.connect(this.ctx.destination);
        noise.start();
      }

      singNote(freq, lyric, duration = 0.25) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let now = this.ctx.currentTime;

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.linearRampToValueAtTime(freq * 1.05, now + duration);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(now + duration);

        showLyrics(lyric);
        jimothy.dance();
      }

      startMusic() {
        this.init();
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.step = 0;

        const songSequence = [
          { f: 300, l: "I'm Jimothy! 🦝" },
          { f: 350, l: "Look at me dance! 🕺" },
          { f: 400, l: "Sniffing flowers... 🌸" },
          { f: 450, l: "SNEEZING CHANCE! 🤧🎉" },
          { f: 500, l: "Disco Raccoon! ✨" },
          { f: 450, l: "Groovy Beans! 🐾" },
          { f: 520, l: "TEE-HEE-HEE! 💖" },
          { f: 600, l: "DISCO QUEEN! 🪩👑" }
        ];

        this.timer = setInterval(() => {
          this.playKick();
          if (this.step % 2 === 1) this.playHiHat();

          if (this.step % 2 === 0) {
            let noteIdx = Math.floor(this.step / 2) % songSequence.length;
            let note = songSequence[noteIdx];
            this.singNote(note.f, note.l, 0.35);
          }

          this.step++;
        }, 320);
      }

      stopMusic() {
        this.isPlaying = false;
        clearInterval(this.timer);
      }
    }

    const audio = new DiscoAudio();

    // --- Jimothy Raccoon Dancer ---
    const jimothy = {
      x: 425, y: 340,
      scaleY: 1, scaleX: 1,
      rotation: 0,
      bounceY: 0,
      armAngle: 0,

      dance() {
        this.bounceY = -30;
        this.scaleX = Math.random() > 0.5 ? 1.15 : 0.85;
        this.scaleY = 1.2;
        this.rotation = (Math.random() - 0.5) * 0.5;
        this.armAngle = (Math.random() - 0.5) * 1.5;
      },

      update() {
        this.bounceY *= 0.8;
        this.scaleX += (1 - this.scaleX) * 0.15;
        this.scaleY += (1 - this.scaleY) * 0.15;
        this.rotation += (0 - this.rotation) * 0.15;
      },

      draw(c) {
        c.save();
        c.translate(this.x, this.y + this.bounceY);
        c.scale(this.scaleX, this.scaleY);
        c.rotate(this.rotation);

        // Body
        c.fillStyle = '#7a8288';
        c.beginPath(); c.ellipse(0, 20, 85, 75, 0, 0, Math.PI * 2); c.fill();

        // Belly
        c.fillStyle = '#f2e9e4';
        c.beginPath(); c.ellipse(0, 30, 55, 45, 0, 0, Math.PI * 2); c.fill();

        // Head
        c.fillStyle = '#9a8c98';
        c.beginPath(); c.ellipse(0, -60, 65, 50, 0, 0, Math.PI * 2); c.fill();

        // Ears
        c.fillStyle = '#4a4e69';
        c.beginPath(); c.arc(-45, -100, 20, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(45, -100, 20, 0, Math.PI * 2); c.fill();

        // Mask
        c.fillStyle = '#22223b';
        c.beginPath();
        c.ellipse(-24, -60, 24, 15, 0.2, 0, Math.PI * 2);
        c.ellipse(24, -60, 24, 15, -0.2, 0, Math.PI * 2);
        c.fill();

        // Cool Disco Sunglasses 🕶️
        c.fillStyle = '#000000';
        c.fillRect(-45, -72, 40, 22);
        c.fillRect(5, -72, 40, 22);
        c.fillRect(-10, -68, 20, 5);
        c.fillStyle = '#ff007f';
        c.fillRect(-40, -70, 30, 4);
        c.fillRect(10, -70, 30, 4);

        // Mouth
        c.fillStyle = '#000000';
        c.beginPath(); c.arc(0, -42, 12, 0, Math.PI); c.fill();

        // Paws / Arms (Dancing)
        c.save();
        c.rotate(this.armAngle);
        c.fillStyle = '#22223b';
        c.beginPath(); c.ellipse(-75, 0, 22, 14, 0, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(75, 0, 22, 14, 0, 0, Math.PI * 2); c.fill();
        c.restore();

        c.restore();
      }
    };

    // --- Disco Ball & Lights Effects ---
    function drawDiscoStage() {
      let now = Date.now() * 0.003;

      // Flashing Light Beams
      const colors = ['rgba(255, 0, 127, 0.2)', 'rgba(0, 255, 234, 0.2)', 'rgba(255, 230, 0, 0.2)'];
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(425, 0);
        ctx.lineTo(100 + i * 160 + Math.sin(now + i) * 60, 550);
        ctx.lineTo(180 + i * 160 + Math.sin(now + i) * 60, 550);
        ctx.closePath();
        ctx.fill();
      }

      // Disco Dance Floor
      let cols = 8, rows = 3;
      let w = 850 / cols, h = 100 / rows;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (r + c + Math.floor(now * 4)) % 2 === 0 ? '#ff007f' : '#00ftea';
          ctx.globalAlpha = 0.3;
          ctx.fillRect(c * w, 450 + r * h, w - 4, h - 4);
          ctx.globalAlpha = 1.0;
        }
      }

      // Disco Ball
      ctx.save();
      ctx.translate(425, 50);
      ctx.strokeStyle = '#aaa';
      ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(0, 0); ctx.stroke();

      ctx.fillStyle = '#e0e0e0';
      ctx.beginPath(); ctx.arc(0, 25, 35, 0, Math.PI * 2); c.fill();

      // Glitter on ball
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 8; i++) {
        let gx = Math.sin(now * 2 + i) * 20;
        let gy = Math.cos(now * 3 + i) * 20 + 25;
        ctx.fillRect(gx, gy, 5, 5);
      }
      ctx.restore();
    }

    // Speech Lyrics Helper
    let lyricsTimeout;
    function showLyrics(text) {
      lyricsBubble.textContent = text;
      lyricsBubble.style.transform = 'translateX(-50%) scale(1)';
      clearTimeout(lyricsTimeout);
      lyricsTimeout = setTimeout(() => {
        lyricsBubble.style.transform = 'translateX(-50%) scale(0)';
      }, 1200);
    }

    // Toggle Music Button
    startBtn.onclick = () => {
      if (!audio.isPlaying) {
        audio.startMusic();
        startBtn.textContent = "🛑 STOP DISCO";
      } else {
        audio.stopMusic();
        startBtn.textContent = "🪩 START DISCO SONG!";
      }
    };

    // Main Loop
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawDiscoStage();
      jimothy.update();
      jimothy.draw(ctx);

      requestAnimationFrame(loop);
    }

    loop();
  </script>

</html>
