<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Silly Portal — Teleporting Jimothy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0f172a;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    #jimothy {
      position: absolute;
      font-size: 5rem;
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body>

  <div id="jimothy">🦝</div>

  <script>
    const jimothy = document.getElementById("jimothy");

    function teleport() {
      const x = Math.random() * (window.innerWidth - 80);
      const y = Math.random() * (window.innerHeight - 80);

      jimothy.style.left = x + "px";
      jimothy.style.top = y + "px";

      jimothy.style.transform = "scale(1.3)";
      setTimeout(() => jimothy.style.transform = "scale(1)", 100);
    }

    setInterval(teleport, 300);
  </script>

</body>
</html>
