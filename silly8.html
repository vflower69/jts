<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Silly 3D — Jimothy Perspective</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0f172a;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      color: #e5e7eb;
    }

    #jimothy {
      font-size: 8rem;
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body>

  <div id="jimothy">🦝</div>

  <script>
    const jimothy = document.getElementById("jimothy");

    document.addEventListener("mousemove", (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;

      const rotateX = y * 30;
      const rotateY = x * 30;
      const scale = 1 + Math.abs(x * y);

      jimothy.style.transform =
        `perspective(300px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(${scale})`;
    });
  </script>

</body>
</html>
