<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jimothy Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    p.subtitle {
      margin: 0.5rem 0 1rem;
      color: #9ca3af;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 0.75rem;
      cursor: pointer;
      background: #1f2937;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 0.5rem;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: #6b7280;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jimothy’s Auto‑Updating Gallery</h1>
    <p class="subtitle">Every new raccoon photo you upload appears here automatically.</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="Expanded view">
  </div>

  <footer>
    Jimothy approves these photos and denies all allegations of snack theft.
  </footer>

  <script>
    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    // CONFIG — CHANGE THESE
    const username = "vflower69";
    const repo = "jts";
    const branch = "main"; // or "master"
    const folderPath = "images";

    async function loadImages() {
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folderPath}?ref=${branch}`;

      try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const imageFiles = files.filter(file =>
          /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        );

        imageFiles.forEach(file => {
          const imgUrl = `https://${username}.github.io/${repo}/${folderPath}/${file.name}`;

          const item = document.createElement("div");
          item.className = "gallery-item";

          const img = document.createElement("img");
          img.src = imgUrl;
          img.alt = file.name;

          img.addEventListener("click", () => {
            lightboxImg.src = imgUrl;
            lightbox.style.display = "flex";
          });

          item.appendChild(img);
          gallery.appendChild(item);
        });

      } catch (err) {
        gallery.innerHTML = "<p style='text-align:center;color:#f87171;'>Failed to load images.</p>";
        console.error(err);
      }
    }

    lightbox.addEventListener("click", () => {
      lightbox.style.display = "none";
    });

    loadImages();
  </script>

  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8c0d32d91bd347e4990d1409f8061d2f"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
