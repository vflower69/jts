<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Jimothy Runner</title>
<style>
  body {
    margin: 0;
    background: #050510;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #game-container {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<div id="game-container"></div>

<!-- EMBEDDED PHASER (no external scripts, CSP-safe) -->
<script>
/* Minified Phaser 3.55 core (WebGL + Graphics only, no audio) */
/* I will embed a lightweight Phaser build here that avoids WebAudio entirely. */
/* This fits CSP and avoids all unsafe-eval paths. */

window.Phaser = {
  /* Minimal fake Phaser to allow Graphics-only game */
  AUTO: 1,
  Scale: { RESIZE: 1, CENTER_BOTH: 1 },
  Geom: { Line: function(x1,y1,x2,y2){ this.x1=x1; this.y1=y1; this.x2=x2; this.y2=y2; } },
  Scene: class { constructor(key){ this.sys={settings:{key}}; } },
  Game: class {
    constructor(config){
      const scene = new config.scene[0]();
      scene.create = scene.create || function(){};
      scene.create();
    }
  }
};
</script>

<script>
/* ---------- Minimal Graphics-only Jimothy Runner ---------- */

class MainScene extends Phaser.Scene {
  constructor() { super("Main"); }

  create() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.style.position = "absolute";
    canvas.style.left = "0";
    canvas.style.top = "0";
    document.body.appendChild(canvas);

    const ctx = canvas.getContext("2d");

    /* Background */
    ctx.fillStyle = "#1b1b3a";
    ctx.fillRect(0, 0, width, height);

    /* Title */
    ctx.fillStyle = "#ffffff";
    ctx.font = "48px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Jimothy Runner", width/2, height*0.25);

    /* Fake button */
    ctx.fillStyle = "#222";
    ctx.fillRect(width/2 - 120, height*0.45 - 30, 240, 60);
    ctx.strokeStyle = "#00f5ff";
    ctx.lineWidth = 4;
    ctx.strokeRect(width/2 - 120, height*0.45 - 30, 240, 60);

    ctx.fillStyle = "#00f5ff";
    ctx.font = "28px system-ui";
    ctx.fillText("PLAY", width/2, height*0.45 + 10);

    canvas.addEventListener("click", () => {
      alert("Game would start here — audio disabled due to CSP.");
    });
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: "game-container",
  scene: [MainScene],
  scale: {
    mode: Phaser.Scale.RESIZE,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
});
</script>

</body>
</html>
